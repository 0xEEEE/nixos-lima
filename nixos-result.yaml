# Use this configuration to start a VM with locally-built images. To build
# images locally, clone the git repo and then run:
# nix build .#packages.aarch64-linux.img --out-link result-aarch64
# or
# nix build .#packages.x86_64-linux.img --out-link result-x86_64
# to build the image.
#
# Optimized for Apple Silicon macOS (Virtualization.framework + virtiofs)
vmType: "vz"
mountType: "virtiofs"

vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true

images:
  - location: "./result-aarch64/nixos.qcow2"
    arch: "aarch64"
  - location: "./result-x86_64/nixos.qcow2"
    arch: "x86_64"

mounts:
- location: "~"
  writable: false
- location: "/tmp/lima"
  writable: true

memory: 8GiB

portForwards:
  # Tell Lima's port-forwarding to ignore port 68 to prevent interception of host DHCP packets
  # Apparently this is an issue with NixOS that does not occur on other Linux distros
  # See: https://github.com/nixos-lima/nixos-lima/issues/50
  - proto: udp
    guestPort: 68
    guestIP: 0.0.0.0
    ignore: true
  # Block cloud metadata service access to prevent credential theft
  # if the host is running in a cloud environment (EC2, GCE, etc.)
  - guestIP: "169.254.169.254"
    ignore: true

containerd:
  system: false
  user: false
