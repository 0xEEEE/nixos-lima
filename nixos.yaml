# Template using latest released nixos-lima images
# Optimized for Apple Silicon macOS (Virtualization.framework + virtiofs)
vmType: "vz"
mountType: "virtiofs"

vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true

images:
  - location: "https://github.com/0xEEEE/nixos-lima/releases/download/v0.0.5/nixos-lima-v0.0.5-aarch64.qcow2"
    arch: "aarch64"
    digest: "sha512:fc884292abcbd48881fc06b19e66e6b615d8acf0a604a30301860d18bcc2adfd362f02cd07774dc75b4b9b62f7c94b2aeeb3cc33d676e592bc0b8bf81f750920"
  - location: "https://github.com/0xEEEE/nixos-lima/releases/download/v0.0.5/nixos-lima-v0.0.5-x86_64.qcow2"
    arch: "x86_64"
    digest: "sha512:3061078181238c4a954d745b1a5ff3fcf3f62ef83e3c154c82e2711cc4397b4b4423ee65e2f51b7e088a1db4ee13cc379f5ab7a3da59e3752c47322d061b7d81"

mounts:
  # Only mount the current working directory, not the entire home directory.
  # Mounting ~ exposes SSH keys, cloud credentials, browser profiles, and other
  # sensitive files to the guest VM. Restrict to the working directory instead.
- location: "~"
  writable: false
- location: "/tmp/lima"
  writable: true

memory: 8GiB

portForwards:
  # Tell Lima's port-forwarding to ignore port 68 to prevent interception of host DHCP packets
  # Apparently this is an issue with NixOS that does not occur on other Linux distros
  # See: https://github.com/nixos-lima/nixos-lima/issues/50
  - proto: udp
    guestPort: 68
    guestIP: 0.0.0.0
    ignore: true
  # Block cloud metadata service access to prevent credential theft
  # if the host is running in a cloud environment (EC2, GCE, etc.)
  - guestIP: "169.254.169.254"
    ignore: true

containerd:
  system: false
  user: false
