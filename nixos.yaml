# Template using latest released nixos-lima images
# Optimized for Apple Silicon macOS (Virtualization.framework + virtiofs)
vmType: "vz"
mountType: "virtiofs"

rosetta:
  enabled: true
  binfmt: true

images:
  - location: "https://github.com/nixos-lima/nixos-lima/releases/download/v0.0.4/nixos-lima-v0.0.4-aarch64.qcow2"
    arch: "aarch64"
    digest: "sha512:a274d225c41918da7f1bb0bc1fde8cc713ed0d36954c21cc26ae403d47879a00f4c3d5601c67c647df87f6f321e1b694140b671910b15a011872311b960569b2"
  - location: "https://github.com/nixos-lima/nixos-lima/releases/download/v0.0.4/nixos-lima-v0.0.4-x86_64.qcow2"
    arch: "x86_64"
    digest: "sha512:5daac286d415a579ca659a98de864fe04ab7a1879d4e4608e3edcd2e931f1848f88ed07316e69a1131ab35b88158b999a21cc5ccf9be9c3d04f51a7e58dc8580"

mounts:
  # Only mount the current working directory, not the entire home directory.
  # Mounting ~ exposes SSH keys, cloud credentials, browser profiles, and other
  # sensitive files to the guest VM. Restrict to the working directory instead.
- location: "~"
  writable: false
- location: "/tmp/lima"
  writable: true

memory: 8GiB

portForwards:
  # Tell Lima's port-forwarding to ignore port 68 to prevent interception of host DHCP packets
  # Apparently this is an issue with NixOS that does not occur on other Linux distros
  # See: https://github.com/nixos-lima/nixos-lima/issues/50
  - proto: udp
    guestPort: 68
    guestIP: 0.0.0.0
    ignore: true
  # Block cloud metadata service access to prevent credential theft
  # if the host is running in a cloud environment (EC2, GCE, etc.)
  - guestIP: "169.254.169.254"
    ignore: true

containerd:
  system: false
  user: false
